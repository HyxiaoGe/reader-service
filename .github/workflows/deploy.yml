name: Deploy to Dev Server
on:
  push:
    branches: ["master"]
  workflow_dispatch:
jobs:
  deploy:
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4
      - name: Sync deploy checkout
        run: |
          cd ~/project/fusion/reader-service && git fetch origin && git reset --hard origin/master && git clean -fd
      - name: Build and deploy
        run: |
          cd ~/project/fusion/reader-service
          docker build -t reader-service .
          docker stop reader-service || true
          docker rm reader-service || true
          docker run -d \
            --name reader-service \
            --restart always \
            --network middleware_default \
            -p 8091:8091 \
            -e JINA_API_KEY=${{ secrets.JINA_API_KEY }} \
            reader-service
      - name: Health check
        run: |
          sleep 3
          curl -sf http://localhost:8091/health || exit 1
      - name: Cleanup
        run: |
          docker image prune -f
